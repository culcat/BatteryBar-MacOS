[package]
name = "battery-bar"
version = "0.2.0"
edition = "2021"

[dependencies]
objc2 = "0.5"
objc2-foundation = { version = "0.2", features = [
    "NSString",
    "NSThread",
    "NSGeometry",
    "dispatch",
] }
objc2-app-kit = { version = "0.2", features = [
    "NSApplication",
    "NSRunningApplication",
    "NSResponder",
    "NSStatusBar",
    "NSStatusItem",
    "NSStatusBarButton",
    "NSView",
    "NSControl",
    "NSButton",
    "NSCell",
    "NSMenu",
    "NSMenuItem",
    "NSImage",
    "NSFont",
    "NSFontDescriptor",
    "NSColor",
    "NSText",
    "NSTextField",
    "NSBezierPath",
] }
regex = "1.11"
